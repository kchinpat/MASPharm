<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pharmacy Drawer</title>
<link rel="stylesheet" href="/cabinet.css">
<script>try { if (localStorage.getItem("pharm-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}</script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" style="fill: var(--logo-tile)"/><g style="fill: var(--logo-mark)"><rect x="7" y="7" width="20" height="3.9" rx="1.2"/><rect x="7" y="12.4" width="20" height="3.9" rx="1.2"/><rect x="7" y="17.8" width="20" height="3.9" rx="1.2"/><rect x="7" y="23.2" width="20" height="3.9" rx="1.2"/></g></svg>
    <span class="brand-name">Pharmacy Drawer</span>
  </div>
  <input class="scan-top" id="rx" autocomplete="off" placeholder="Scan a package to dispense" aria-label="Scan a package to dispense">
  <span class="mode" id="mode">Loading</span>
  <details class="menu" id="main-menu">
    <summary>Menu</summary>
    <div class="menu-list">
      <button id="manual-button">Unlock a drawer</button>
      <button id="status-button">Device status</button>
      <button id="catalog-button">Choose catalog</button>
      <a href="/api/audit" download>Export audit</a>
      <a href="/api/backup" download>Backup</a>
      <hr>
      <button id="theme-button">Dark theme</button>
    </div>
  </details>
  <input type="file" id="catalog-file" accept=".json,application/json" hidden>
</header>

<main class="shell">
  <nav class="cabinet" id="drawers" aria-label="Drawers"></nav>
  <section class="panel" id="panel">
    <div class="view" id="view"></div>
    <div class="view hidden" id="load-view">
      <p class="caption" id="load-caption">Load</p>
      <h2>Scan the package</h2>
      <p class="note" id="load-current"></p>
      <div class="scan-row"><input class="scan" id="load-scan" autocomplete="off" aria-label="Package barcode"><button id="lookup-button">Look up</button></div>
      <p class="notice" id="lookup-notice"></p>
      <p class="notice" id="serial"></p>
      <div class="fields" id="fields"></div>
      <div class="actions"><div class="row">
        <button class="primary large" id="load-box">Confirm and load box</button>
        <button class="large" id="load-done" hidden>Finish loading</button>
        <button class="large" id="load-cancel">Cancel</button>
      </div></div>
    </div>
    <section class="prompt hidden" id="prompt" role="dialog" aria-modal="true" aria-labelledby="dialog-text">
      <p class="caption" id="dialog-title"></p>
      <h2 id="dialog-text"></h2>
      <div id="dialog-extra"></div>
      <input id="dialog-input" autocomplete="off" hidden>
      <div class="buttons"><button class="primary large" id="dialog-ok">Continue</button><button class="large" id="dialog-cancel">Cancel</button></div>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
  </section>
</main>
<script>
"use strict";
const token = "__PHARM_TOKEN__";
const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const labels = {generic_name:"Medication",ndc:"Package ID",lot:"Lot",expiry_date:"Expiration date",unit:"Unit counted (bottle, box, tablet)",description:"Package description",brand_name:"Brand",labeler_name:"Labeler"};
const optional = new Set(["description","brand_name","labeler_name"]);
const wide = new Set(["generic_name","description"]);
let state = null, operation = null, prepared = null, working = false;
let selected = 1, view = "drawer", loadDrawer = 1, context = "", promptOpen = false;
const moreFields = document.createElement("details");
moreFields.className = "more-fields";
moreFields.innerHTML = '<summary>More details</summary><div class="fields"></div>';
for (const [key,label] of Object.entries(labels)) {
  const field = document.createElement("label");
  field.classList.toggle("wide", wide.has(key));
  field.textContent = label;
  const input = document.createElement("input"); input.id = "field-" + key;
  if (key === "expiry_date") input.type = "date";
  field.append(input);
  (optional.has(key) ? moreFields.querySelector(".fields") : $("fields")).append(field);
}
$("fields").append(moreFields);
function localToday() { const now = new Date(); return new Date(now - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function plural(unit, count) {
  unit = String(unit || "").trim();
  if (count === 1 || !/^[a-z]+$/.test(unit) || unit.endsWith("s")) return unit;
  return unit + (/(x|ch|sh)$/.test(unit) ? "es" : "s");
}
function expiryNote(expiry) {
  const days = Math.round((new Date(expiry + "T00:00") - new Date(localToday() + "T00:00")) / 86400000);
  if (days < 0) return ["Expired", true];
  if (days === 0) return ["Expires today", true];
  if (days <= 31) return [`Expires in ${days} day${days === 1 ? "" : "s"}`, true];
  return [`Expires ${expiry}`, false];
}
async function api(path, data) {
  const response = await fetch(path, data === undefined ? {} : {method:"POST",headers:{"Content-Type":"application/json","X-Pharm-Token":token},body:JSON.stringify(data)});
  const result = await response.json();
  if (!response.ok || result.ok === false) throw new Error(result.message || "The request failed.");
  return result;
}
async function run(action) {
  if (working) return;
  working = true; paintBusy();
  try { await action(); }
  catch (error) { $("message").textContent = error.message; }
  finally { try { await refresh(); } catch(error) { $("message").textContent=error.message; } finally { working=false; paintBusy(); } }
}
// One guided step at a time, shown over the work panel.
function ask(title, text, type=null, initial="", extra="", options={}) {
  return new Promise(resolve => {
    const prompt = $("prompt");
    promptOpen = true;
    prompt.className = "prompt" + (options.tone ? " " + options.tone : "");
    $("dialog-title").textContent = (context ? context + "  ·  " : "") + title;
    $("dialog-text").textContent = text;
    $("dialog-extra").innerHTML = extra;
    $("dialog-ok").textContent = options.ok || "Continue";
    $("dialog-ok").className = (options.danger ? "danger" : "primary") + " large";
    $("dialog-cancel").hidden = !!options.noCancel;
    const input = $("dialog-input"); input.hidden = !type; input.type = type || "text"; input.value = initial;
    const finish = okay => { prompt.classList.add("hidden"); promptOpen = false; paintBusy(); resolve(okay ? (type ? input.value : true) : null); };
    $("dialog-ok").onclick = () => finish(true); $("dialog-cancel").onclick = () => finish(false);
    prompt.onkeydown = event => { if (event.key === "Escape" && !options.noCancel) { event.preventDefault(); finish(false); } };
    input.onkeydown = event => { if (event.key === "Enter") { event.preventDefault(); finish(true); } };
    paintBusy();
    if (type) { input.focus(); input.select(); } else $("dialog-ok").focus();
  });
}
function paintBusy() {
  const active = !!state?.active;
  for(const id of ["manual-button","catalog-button"]) $(id).disabled = working || active;
  for(const id of ["status-button","lookup-button","load-box","load-done","load-cancel"]) $(id).disabled = working;
  $("rx").disabled = working || active || promptOpen;
  for(const button of $("drawers").querySelectorAll("button")) button.disabled = working || promptOpen || !!operation;
  for(const button of $("view").querySelectorAll("button[data-action]"))
    button.disabled = working || (active && ["dispense","load","unload"].includes(button.dataset.action));
}
function front(d) {
  const p = d.product, filled = d.quantity > 0, pending = state.active?.compartment === d.id;
  const open = pending || state.open_mode.includes(d.id), tone = open ? "open" : filled ? "stocked" : "empty";
  let line = "";
  if (pending) line = '<span class="flag">Needs count</span>';
  else if (filled) { const [note, urgent] = expiryNote(p.expiry_date); line = `${d.quantity} ${esc(plural(p.unit, d.quantity))} · <span class="${urgent?"urgent":""}">${esc(note)}</span>`; }
  if (open) line += `${line?" · ":""}<span class="open">Open</span>`;
  return `<button class="front tone-${tone}${d.id===selected?" selected":""}" data-select="${d.id}"><span class="num">${d.id}</span><span><span class="name${filled?"":" empty"}">${filled?esc(p.generic_name):"Empty"}</span>${line?`<span class="line">${line}</span>`:""}</span></button>`;
}
function drawerView() {
  const d = state.drawers[selected-1], p = d.product, active = state.active;
  const blocked = active && active.compartment !== d.id ? `<p class="blocked">Drawer ${active.compartment} needs a count first. <button class="link" data-select="${active.compartment}">Go to drawer ${active.compartment}</button></p>` : "";
  if (active && active.compartment === d.id) {
    const recorded = JSON.parse(active.product || "{}");
    return `<p class="caption warn">Drawer ${d.id} · Needs count</p><h2>Count drawer ${d.id}</h2>
      <p class="note">A ${esc(active.kind)} was interrupted. Check what is physically in the drawer, then record what you find. Other drawers stay locked until this is done.</p>
      ${recorded.generic_name?`<p class="note">Recorded: ${esc(recorded.generic_name)} · lot ${esc(recorded.lot)}</p>`:""}
      <div class="actions"><div class="row"><button class="warning large" data-action="reconcile">Count drawer ${d.id}</button></div></div>`;
  }
  if (!d.quantity) return `<p class="caption">Drawer ${d.id}</p><h2 class="empty">Empty</h2><p class="note">Nothing is in this drawer. Load it before dispensing.</p>${blocked}
      <div class="actions"><div class="row"><button class="primary large" disabled>Dispense</button><button class="large" data-action="load">Load drawer ${d.id}</button></div></div>`;
  const lots = [...new Set(d.items.map(i=>i.product.lot))];
  const [note, urgent] = expiryNote(p.expiry_date);
  const maker = [p.brand_name, p.labeler_name].filter(Boolean).join(" · ");
  const photo = d.photo
    ? `<button class="photo" data-action="photo" aria-label="Enlarge the package label photo"><img src="${esc(d.photo)}" alt="Package label for ${esc(p.generic_name)}"></button>`
    : `<p class="photo-empty">No label photo saved <button class="link" data-action="photo">Download photo</button></p>`;
  return `<p class="caption">Drawer ${d.id}</p><h2>${esc(p.generic_name)}</h2>${maker?`<p class="maker">${esc(maker)}</p>`:""}
    <div class="facts"><div class="count"><b>${d.quantity}</b><span>${esc(plural(p.unit, d.quantity))} in drawer</span></div>
      <div class="${urgent?"urgent":""}"><b>${esc(p.expiry_date)}</b><span>${urgent?esc(note.toLowerCase()):"expires"}</span></div>
      <div><b>${esc((lots.length?lots:[p.lot]).join(", "))}</b><span>${lots.length>1?"lots":"lot"}</span></div></div>
    <p class="package">Package ID ${esc(p.ndc)}</p>${photo}${blocked}
    <div class="actions"><div class="row"><button class="primary large" data-action="dispense">Dispense</button><button class="large" data-action="load">Load more</button></div>
      <div class="links"><button class="link" data-action="unload">Unload drawer</button><button class="link" data-action="records">Box records</button></div></div>`;
}
function render() {
  $("drawers").innerHTML = state.drawers.map(front).join("");
  $("view").classList.toggle("hidden", view !== "drawer");
  $("load-view").classList.toggle("hidden", view !== "load");
  if (view === "drawer") $("view").innerHTML = drawerView();
  paintBusy();
}
async function refresh() {
  state = await api("/api/state");
  $("mode").textContent = state.simulation ? "Simulation" : state.mode;
  $("mode").classList.toggle("hardware", !state.simulation);
  const active = state.active;
  const ownLoad = active && operation?.id === active.id && active.kind === "load" && active.state === "access";
  if (active && !ownLoad && view === "drawer") selected = active.compartment;
  $("load-done").hidden = !ownLoad;
  if(ownLoad) { operation=active; $("load-box").textContent="Add this scanned box"; $("lookup-notice").textContent=`${active.requested} boxes staged. Inventory will be saved after placement and closure confirmations.`; }
  render();
}
function select(number) {
  if (working || promptOpen || operation) return;
  selected = number; view = "drawer"; render();
}
function showLoad(number) {
  prepared=null; operation=null; loadDrawer=number; selected=number; view="load";
  const product=state.drawers[number-1].product;
  $("load-caption").textContent=`Load · Drawer ${number}`;
  $("load-current").textContent=product.generic_name?`Holds ${product.generic_name}. New boxes must be the same package.`:"";
  $("load-scan").value=""; $("load-box").textContent="Confirm and load box";
  for(const key of Object.keys(labels)) $("field-"+key).value=product[key]||(key==="unit"?"box":"");
  $("serial").textContent="";
  $("lookup-notice").textContent=state.catalog||"Scan a barcode, or type the package ID and press Enter.";
  render();
  $("load-scan").focus();
}
async function lookup() {
  const scan=$("load-scan").value.trim(); prepared=await api("/api/preview",{scan});
  const existing=state.drawers[loadDrawer-1].product;
  if(existing.ndc && existing.ndc.replaceAll("-","")===prepared.product.ndc?.replaceAll("-","")) {
    prepared.product={...existing,...prepared.product};
    if(!prepared.scan.lot) prepared.product.lot=existing.lot;
    if(!prepared.scan.expiry_date) prepared.product.expiry_date=existing.expiry_date;
    prepared.product.unit=existing.unit;
  }
  for(const key of Object.keys(labels)) $("field-"+key).value=prepared.product[key]||"";
  $("lookup-notice").textContent=prepared.notice;
  $("serial").textContent=prepared.scan.serial?`Serial ${prepared.scan.serial}`:"";
}
async function loadBox() {
  context = `Drawer ${loadDrawer}`;
  const scan=$("load-scan").value.trim();
  if(scan && (!prepared || prepared.scan.original_scan!==scan)) await lookup();
  const product=Object.fromEntries(Object.keys(labels).map(key=>[key,$("field-"+key).value]));
  if(operation) {
    operation=(await api("/api/add",{operation:operation.id,product,scan})).operation;
  } else {
    operation=(await api("/api/start",{kind:"load",drawer:loadDrawer,count:1,product,scan})).operation;
  }
  $("message").textContent="Place this box in the drawer. Scan the next box, or choose Finish loading.";
  $("load-scan").value=""; prepared=null; $("load-scan").focus();
}
async function cancelOperation(id, reason) {
  await api("/api/cancel",{operation:id,reason}); operation=null; view="drawer";
  $("message").textContent="Inventory is not finalized. Count the drawer before continuing.";
}
async function complete(op) {
  if(!await ask("Confirm physical contents",op.kind==="load"?`Have all ${op.requested} staged boxes been placed in drawer ${op.compartment}?`:op.kind==="unload"?"Have all contents been removed and the drawer checked empty?":`Have exactly ${op.requested} verified boxes been removed?`,null,"","",{ok:"Yes",cancel:"No"})) return cancelOperation(op.id,"Physical count not confirmed");
  if(!await ask("Confirm closure","Close the selected drawer. Have you confirmed it is closed?",null,"","",{ok:"Yes"})) return cancelOperation(op.id,"Closure not confirmed");
  const result=await api("/api/finish",{operation:op.id,placed:true,closed:true});
  operation=null; view="drawer"; $("message").textContent="Inventory saved."+(result.lock_ok?"":" Lock request failed: "+result.lock_message);
}
async function dispense(number) {
  context = `Drawer ${number}`;
  const drawer=state.drawers[number-1];
  const text=await ask("Dispense",`How many ${plural(drawer.product.unit, 2)} of ${drawer.product.generic_name}? ${drawer.quantity} in the drawer.`,"number","1");
  if(text===null) return;
  const count=Number(text); if(!Number.isInteger(count)||count<1) throw new Error("Enter a positive whole number.");
  let op=(await api("/api/start",{kind:"dispense",drawer:number,count})).operation;
  for(let index=0;index<count;index++) {
    const scan=await ask("Verify each box",`Scan box ${index+1} of ${count} as you remove it. If access has timed out, submit an empty scan to request reopening.`,"text","","",{ok:"Submit scan"});
    if(scan===null) return cancelOperation(op.id,"Cancelled after drawer access");
    if(scan.trim()==="") { if(await ask("Request drawer access again","Request one new access command for the same drawer?",null,"","",{ok:"Yes"})) await api("/api/reopen",{operation:op.id}); index--; continue; }
    op=(await api("/api/verify",{operation:op.id,scan})).operation;
  }
  await complete(op);
}
async function unload(number) {
  context = `Drawer ${number}`;
  if(!await ask("Unload drawer",`Remove all stock from drawer ${number}?`,null,"","",{ok:"Unload drawer",danger:true,tone:"warn"})) return;
  const op=(await api("/api/start",{kind:"unload",drawer:number})).operation;
  await complete(op);
}
function showRecords(number) {
  context = `Drawer ${number}`;
  const items=state.drawers[number-1].items;
  return ask("Box records",`${items.length} recorded ${items.length===1?"box":"boxes"}`,null,"",
    `<div class="box-list">${items.map(i=>`<div>Lot ${esc(i.product.lot)} · ${esc(i.product.expiry_date)} · Serial ${esc(i.serial||"not recorded")}</div>`).join("")}</div>`,{ok:"Close",noCancel:true});
}
async function packagePhoto(number) {
  context = `Drawer ${number}`;
  const drawer=state.drawers[number-1];
  if(drawer.photo) { await ask("Package photo",drawer.product.generic_name,null,"",`<img src="${esc(drawer.photo)}" alt="Package photo">`,{ok:"Close",noCancel:true}); return; }
  if(!await ask("Package photo","No photo is saved for this package. Download one from DailyMed?",null,"","",{ok:"Download"})) return;
  $("message").textContent=(await api(`/api/photo/${number}`,{})).message;
}
async function manual() {
  context = "";
  const text=await ask("Unlock a drawer","Which drawer? (1 to 4)","number","1"); if(text===null) return;
  context = `Drawer ${text}`;
  const reason=await ask("Unlock a drawer","Why does it need to be opened?","text"); if(reason===null) return;
  const op=(await api("/api/start",{kind:"manual",drawer:Number(text),reason})).operation;
  await ask("Drawer open",`Drawer ${op.compartment} is open. When you're done, count what is in it.`,null,"","",{ok:"Done",noCancel:true});
  await cancelOperation(op.id,"Manual inspection requires a physical count");
}
async function reconcile() {
  const op=state.active;
  context = `Drawer ${op.compartment}`;
  const records=state.choices;
  const tracked=records.some(i=>i.serial)||new Set(records.map(i=>JSON.stringify(i.product))).size>1;
  let count, ids;
  if(tracked) {
    const list=`<div class="box-list">${records.map(i=>`<label><input type="checkbox" class="remaining-box" value="${esc(i.id)}"> Lot ${esc(i.product.lot)} · ${esc(i.product.expiry_date)} · Serial ${esc(i.serial||"not recorded")}</label>`).join("")}</div>`;
    const okay=await ask("Count drawer","Tick each box that is physically in the drawer. Remove anything else.",null,"",list);
    if(!okay) return;
    ids=Array.from(document.querySelectorAll(".remaining-box:checked"),e=>e.value); count=ids.length;
  } else {
    const text=await ask("Count drawer","How many of the recorded product and lot are physically in the drawer? Remove anything else first.","number","0"); if(text===null) return;
    count=Number(text); if(!Number.isInteger(count)||count<0) throw new Error("Enter a nonnegative whole number.");
  }
  const reason=await ask("Count drawer","What happened? This is recorded in the audit log.","text"); if(reason===null) return;
  if(!await ask("Confirm closure","Have you verified the contents and closed all four drawers?",null,"","",{ok:"Yes"})) return;
  const data={operation:op.id,count,reason,closed:true}; if(ids) data.remaining_ids=ids;
  const result=await api("/api/reconcile",data); operation=null; view="drawer"; $("message").textContent="Count saved."+(result.lock_ok?"":" Lock request failed: "+result.lock_message);
}
document.addEventListener("click", event => {
  for (const menu of document.querySelectorAll("details.menu[open]")) if (!menu.contains(event.target)) menu.removeAttribute("open");
  const pick = event.target.closest("[data-select]");
  if (pick) return select(Number(pick.dataset.select));
  const button = event.target.closest("#view button[data-action]");
  if (!button) return;
  const number = selected, action = button.dataset.action;
  if (action === "load") return showLoad(number);
  run(() => action === "dispense" ? dispense(number) : action === "unload" ? unload(number)
    : action === "records" ? showRecords(number) : action === "reconcile" ? reconcile() : packagePhoto(number));
});
$("main-menu").addEventListener("click", event => { if (event.target.closest(".menu-list button, .menu-list a")) $("main-menu").removeAttribute("open"); });
$("manual-button").onclick=()=>run(manual);
function showTheme() { $("theme-button").textContent = document.documentElement.dataset.theme === "dark" ? "Light theme" : "Dark theme"; }
$("theme-button").onclick=()=>{
  const dark = document.documentElement.dataset.theme !== "dark";
  if (dark) document.documentElement.dataset.theme = "dark"; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("pharm-theme", dark ? "dark" : "light"); } catch (e) {}
  showTheme();
};
showTheme();
$("lookup-button").onclick=()=>run(lookup);
$("load-scan").onkeydown=event=>{if(event.key==="Enter") {event.preventDefault();run(lookup);}};
$("load-box").onclick=()=>run(loadBox);
$("load-done").onclick=()=>run(()=>complete(operation));
$("load-cancel").onclick=()=>run(async()=>{if(operation) await cancelOperation(operation.id,"Loading cancelled after access"); view="drawer";});
$("rx").onkeydown=event=>{if(event.key==="Enter") {event.preventDefault();run(async()=>{const match=await api("/api/find",{scan:$("rx").value});$("rx").value="";let number=match.drawers[0];if(match.drawers.length>1){context="";const text=await ask("Choose a drawer",`This package is in drawers ${match.drawers.join(", ")}. Which one?`,"number",String(number));if(text===null)return;number=Number(text);if(!match.drawers.includes(number))throw new Error("Choose a matching drawer.");}selected=number;view="drawer";render();await dispense(number);});}};
$("status-button").onclick=()=>run(async()=>{ $("message").textContent=(await api("/api/status")).message; });
$("catalog-button").onclick=()=>$("catalog-file").click();
$("catalog-file").onchange=()=>run(async()=>{
  if(!$("catalog-file").files[0]) return;
  const form=new FormData(); form.append("catalog",$("catalog-file").files[0]);
  const response=await fetch("/api/catalog",{method:"POST",headers:{"X-Pharm-Token":token},body:form});const result=await response.json();
  if(!response.ok) throw new Error(result.message); $("message").textContent="Catalog selected and remembered.";$("catalog-file").value="";
});
let messageTimer;
new MutationObserver(() => {
  const box = $("message");
  box.classList.toggle("show", !!box.textContent);
  clearTimeout(messageTimer);
  if (box.textContent) messageTimer = setTimeout(() => box.classList.remove("show"), 6000);
}).observe($("message"), {childList:true, characterData:true, subtree:true});
refresh().then(()=>$("rx").focus()).catch(error=>$("message").textContent=error.message);
setInterval(()=>{if(!working&&!promptOpen&&!document.querySelector("details.menu[open]"))refresh().catch(()=>{});},4000);
window.addEventListener("beforeunload",event=>{if(operation){event.preventDefault();event.returnValue="";}});
</script>
</body>
</html>
